name: erp_pos_flutter
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # State Management (Riverpod)
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6

  # Database (Drift)
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path: ^1.9.1
  path_provider: ^2.1.6

  # Network & Utilities
  dio: ^5.11.0
  connectivity_plus: ^7.3.1
  uuid: ^4.6.0
  json_annotation: ^4.9.0
  freezed_annotation: ^3.0.0
  go_router: ^17.5.0
  intl: ^0.20.3
  logging: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  
  # Code Generators (ปรับให้ analyzer / source_gen ตรงกัน)
  build_runner: ^2.4.15
  drift_dev: ^2.34.0
  riverpod_generator: ^4.0.8
  freezed: ^4.0.1
  json_serializable: ^6.9.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true